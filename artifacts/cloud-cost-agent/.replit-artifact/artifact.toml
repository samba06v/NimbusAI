kind = "web"
previewPath = "/"
title = "Cloud Cost Optimization Agent"
version = "1.0.0"
id = "artifacts/cloud-cost-agent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22139

[services.development]
run = "pnpm --filter @workspace/cloud-cost-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cloud-cost-agent", "run", "build" ]
publicDir = "artifacts/cloud-cost-agent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22139"
BASE_PATH = "/"
